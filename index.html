<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>My Expenses</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header>
    <div>
      <div class="eyebrow">PERSONAL FINANCE</div>
      <h1>My Expenses</h1>
    </div>
    <button id="installBtn" class="icon-btn" hidden>⇩</button>
  </header>

  <section class="hero">
    <div class="label">TOTAL EXPENSES</div>
    <div id="total" class="total">₹0</div>
    <div id="monthLabel" class="muted"></div>
  </section>

  <section class="summary-grid">
    <div class="card"><span>Today</span><strong id="todayTotal">₹0</strong></div>
    <div class="card"><span>This month</span><strong id="monthTotal">₹0</strong></div>
    <div class="card"><span>Grocery</span><strong id="groceryTotal">₹0</strong></div>
    <div class="card"><span>Others</span><strong id="othersTotal">₹0</strong></div>
  </section>

  <section class="toolbar">
    <h2>Expenses</h2>
    <select id="filter">
      <option value="All">All</option>
      <option value="Grocery">Grocery</option>
      <option value="Others">Others</option>
    </select>
  </section>

  <main id="list"></main>
  <button id="addBtn" class="fab">＋ <span>Add expense</span></button>
</div>

<div id="modal" class="modal hidden">
  <div class="sheet">
    <div class="sheet-head"><h2>Add expense</h2><button id="closeBtn" class="close">×</button></div>
    <form id="expenseForm">
      <label>Amount
        <div class="amount-wrap"><span>₹</span><input id="amount" type="number" inputmode="decimal" min="0.01" step="0.01" placeholder="0" required></div>
      </label>
      <label>Date
        <input id="date" type="date" required>
      </label>
      <label>Category
        <select id="category" required>
          <option value="Grocery">Grocery</option>
          <option value="Others">Others</option>
        </select>
      </label>
      <label>Details <span class="optional">(optional)</span>
        <textarea id="details" rows="3" maxlength="120" placeholder="What was this payment for? e.g. vegetables, milk, electricity bill..."></textarea>
      </label>
      <button class="primary" type="submit">Add expense</button>
    </form>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
